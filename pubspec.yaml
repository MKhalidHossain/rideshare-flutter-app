name: rideztohealth
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.1+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get:
  flutter_svg: ^2.1.0
  http: ^1.4.0
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  file_picker: ^10.1.9
  path: ^1.9.1
  intl: ^0.18.1
  video_player: ^2.9.5
  get_storage: ^2.1.1
  motion_tab_bar: ^2.0.4
  pinput: ^5.0.1
  google_maps_flutter: ^2.12.3
  location: ^8.0.1
  geolocator: ^14.0.2
  flutter_polyline_points: ^3.1.0
  geocoding: ^4.0.0
  flutter_typeahead: ^5.2.0
  permission_handler: ^12.0.1
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  dio: ^5.9.0
  webview_flutter: ^4.8.0
  font_awesome_flutter: ^10.12.0
  socket_io_client: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: notoSansKR
      fonts:
        - asset: assets/fonts/notoSansKR/NotoSansKR.ttf
          weight: 100
        - asset: assets/fonts/notoSansKR/NotoSansKR.ttf
          weight: 200
        - asset: assets/fonts/notoSansKR/NotoSansKR.ttf
          weight: 300
        - asset: assets/fonts/notoSansKR/NotoSansKR.ttf
          weight: 400
        - asset: assets/fonts/notoSansKR/NotoSansKR.ttf
          weight: 500
        - asset: assets/fonts/notoSansKR/NotoSansKR.ttf
          weight: 600
        - asset: assets/fonts/notoSansKR/NotoSansKR.ttf
          weight: 700
        - asset: assets/fonts/notoSansKR/NotoSansKR.ttf
          weight: 800
        - asset: assets/fonts/notoSansKR/NotoSansKR.ttf
          weight: 900
